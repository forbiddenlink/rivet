version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/cli"
      - "/apps/web"
      - "/examples/test-project"
      - "/packages/ai"
      - "/packages/core"
      - "/packages/engines/architecture"
      - "/packages/engines/bugs"
      - "/packages/engines/dependencies"
      - "/packages/engines/flows"
      - "/packages/engines/performance"
      - "/packages/engines/practices"
      - "/packages/engines/security"
      - "/packages/engines/smells"
      - "/packages/parsers"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"
