name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm frustrated when... It would be helpful to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        I'd like to be able to...
        
        Example:
        ```bash
        rivet scan --custom-rule "no-console"
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you tried or considered?
      placeholder: I've tried using... but it doesn't work because...

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe how you would use this feature in practice
      placeholder: |
        In my project, I would use this to...
        This would help my team by...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - "Nice to have"
        - "Important"
        - "Critical"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What part of RIVET does this relate to?
      options:
        - "CLI"
        - "Security Engine"
        - "Bug Detection"
        - "Code Smells"
        - "Performance"
        - "Dependencies"
        - "Flow Testing"
        - "AI Explanations"
        - "Auto-fix"
        - "Configuration"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Show examples of how this feature would work
      render: typescript
      placeholder: |
        // Before
        const result = rivet.scan()
        
        // After (with new feature)
        const result = rivet.scan({ customRules: [...] })

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
        - label: I can provide a PR for this feature

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else we should know?
      placeholder: Similar tools like X have this feature...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues/discussions for similar requests
          required: true
        - label: I have provided a clear use case for this feature
          required: true
