name: RIVET Code Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  rivet-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install RIVET CLI
        id: install-rivet
        continue-on-error: true
        run: |
          npm install -g @rivet/cli 2>/dev/null || echo "RIVET CLI not available on npm"

      - name: Run RIVET Analysis
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if command -v rivet &> /dev/null; then
            rivet scan . \
              --format sarif \
              --output rivet-results.sarif \
              --severity medium \
              --ai \
              --tech-debt || echo '{"runs":[{"results":[]}]}' > rivet-results.sarif
          else
            echo "RIVET CLI not installed, creating empty SARIF"
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"RIVET","version":"0.0.0"}},"results":[]}]}' > rivet-results.sarif
          fi
            
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: rivet-results.sarif
          category: rivet-analysis
          
      - name: Upload Results as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rivet-analysis-results
          path: rivet-results.sarif
          retention-days: 30
          
      - name: Comment PR with Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('rivet-results.sarif', 'utf8'));
            const results = sarif.runs[0].results || [];
            
            const critical = results.filter(r => r.level === 'error').length;
            const high = results.filter(r => r.level === 'warning').length;
            const medium = results.filter(r => r.level === 'note').length;
            
            const comment = `## 🔩 RIVET Analysis Results
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical/High | ${critical} |
            | 🟡 Medium | ${high} |
            | 🔵 Low/Info | ${medium} |
            | **Total** | **${results.length}** |
            
            ${results.length > 0 ? '⚠️ Please review the issues before merging.' : '✅ No issues found!'}
            
            [View detailed results in the Security tab](${context.payload.repository.html_url}/security/code-scanning)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  fail-on-critical:
    needs: rivet-analysis
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check for critical issues
        run: |
          echo "This job would fail the build if critical issues are found"
          # Add logic to parse SARIF and exit 1 if critical issues exist
