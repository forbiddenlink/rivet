name: RIVET Code Quality Analysis

# RIVET scans itself. The CLI is built from this checkout rather than installed
# from npm: @rivet/cli is not published, so the previous `npm install -g @rivet/cli`
# always failed, every step swallowed the failure, and the job uploaded an empty
# SARIF while commenting "No issues found" on the pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  rivet-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build RIVET
        run: pnpm build

      # --fail-on none because this job's gate is the error budget below, not the
      # scan's own exit code. With the default of `high` the scan exited 1 on its own
      # findings, the job stopped there, and the SARIF upload, the summary and the
      # budget check never ran.
      - name: Run RIVET analysis
        run: |
          node apps/cli/dist/index.js scan . \
            --format sarif \
            --output rivet-results.sarif \
            --severity medium \
            --max-issues 1000 \
            --fail-on none

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: rivet-results.sarif
          category: rivet-analysis

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rivet-analysis-results
          path: rivet-results.sarif
          retention-days: 30

      - name: Summarize findings
        id: summary
        run: |
          node -e '
            const fs = require("node:fs");
            const sarif = JSON.parse(fs.readFileSync("rivet-results.sarif", "utf8"));
            const results = sarif.runs?.[0]?.results ?? [];
            const count = (level) => results.filter((r) => r.level === level).length;
            const counts = { error: count("error"), warning: count("warning"), note: count("note"), total: results.length };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(counts).map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
            const lines = [
              "## RIVET analysis",
              "",
              "| Level | Count |",
              "| --- | --- |",
              `| Error | ${counts.error} |`,
              `| Warning | ${counts.warning} |`,
              `| Note | ${counts.note} |`,
              `| **Total** | **${counts.total}** |`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ERRORS: ${{ steps.summary.outputs.error }}
          WARNINGS: ${{ steps.summary.outputs.warning }}
          NOTES: ${{ steps.summary.outputs.note }}
          TOTAL: ${{ steps.summary.outputs.total }}
        with:
          script: |
            const { ERRORS, WARNINGS, NOTES, TOTAL } = process.env
            const body = [
              '## RIVET analysis',
              '',
              '| Level | Count |',
              '| --- | --- |',
              `| Error | ${ERRORS} |`,
              `| Warning | ${WARNINGS} |`,
              `| Note | ${NOTES} |`,
              `| **Total** | **${TOTAL}** |`,
              '',
              Number(TOTAL) > 0
                ? `[Review the findings in the Security tab](${context.payload.repository.html_url}/security/code-scanning?query=tool%3ARIVET)`
                : 'No findings at or above the medium severity threshold.',
            ].join('\n')

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

      # The threshold sits above the current count on purpose. A gate that is red
      # from the day it lands is a gate people route around; this one only fires
      # when the error count grows.
      #
      # 140 comes from running this workflow's exact scan command on a clean build on
      # 2026-09-24: 121 error-level results, led by high-complexity (40) and
      # long-method (29). Re-derive it from the first real run of this workflow rather
      # than trusting this number, because this workflow is disabled and has therefore
      # never produced one.
      - name: Fail if error-level findings exceed the budget
        env:
          ERRORS: ${{ steps.summary.outputs.error }}
          ERROR_BUDGET: '140'
        run: |
          if [ "$ERRORS" -gt "$ERROR_BUDGET" ]; then
            echo "RIVET reported $ERRORS error-level findings, over the budget of $ERROR_BUDGET."
            echo "Fix the new findings, or raise ERROR_BUDGET in this workflow with a reason."
            exit 1
          fi
          echo "RIVET reported $ERRORS error-level findings, within the budget of $ERROR_BUDGET."
